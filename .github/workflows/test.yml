name: Test installs
on:
  push:
    paths: ['Formula/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
        formula: [ted, wex]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7
      - run: |
          brew install jonasbg/tap/${{ matrix.formula }}
          brew test jonasbg/tap/${{ matrix.formula }}
